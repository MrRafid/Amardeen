<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f4f5f7">
    <title>Amar Deen - আমার দ্বীন</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Hind Siliguri"', 'sans-serif'], arabic: ['"Amiri"', 'serif'] },
                    colors: { appGreen: '#238968', husnaBg: '#1b6b5c' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #e2e8f0; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; margin: 0; min-height: 100vh; }
        #app-container { width: 100%; max-width: 400px; background-color: #f4f5f7; min-height: 100vh; box-shadow: 0 10px 40px rgba(0,0,0,0.1); position: relative; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .icon-box { width: 42px; height: 42px; background: #ffffff; border-radius: 12px; display: flex; justify-content: center; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.05); transition: all 0.15s ease; border: 1px solid #f1f5f9; }
        .cat-item:active .icon-box { transform: scale(0.92); background: #f8fafc; }
        #extraCategories { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.3s ease-in-out; }
        #locList::-webkit-scrollbar { width: 4px; display: block; }
        #locList::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 antialiased font-sans">

    <div id="app-container" class="pb-8">

        <!-- HEADER -->
        <header class="flex justify-between items-center px-4 py-2 sticky top-0 z-30 bg-[#f4f5f7]/95 backdrop-blur-md border-b border-gray-200/50">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 bg-appGreen rounded-[8px] flex justify-center items-center text-white shadow-sm">
                    <i class="fa-solid fa-kaaba text-[12px]"></i>
                </div>
                <h1 class="text-[17px] font-bold tracking-tight text-slate-800 leading-none mt-1">Amar Deen</h1>
            </div>
        </header>

        <main class="px-4 mt-3 space-y-3.5">

            <!-- PRAYER TIME BANNER -->
            <section class="bg-white rounded-[14px] p-3 shadow-sm border border-gray-100 flex justify-between items-center z-20 relative gap-3">
                <div class="flex flex-col flex-1 min-w-0 border-r border-gray-100 pr-2">
                    <span class="text-[10px] text-gray-500 font-medium mb-0.5">পরবর্তী নামাজ:</span>
                    <div class="flex items-baseline gap-1.5 flex-wrap">
                        <span id="nextPrayerName" class="text-[15px] font-bold text-slate-800 leading-none">--</span>
                        <span id="nextPrayerTime" class="text-[12px] font-mono font-semibold text-appGreen whitespace-nowrap">--:--</span>
                    </div>
                    <div class="text-[10px] font-medium text-gray-400 mt-1">
                        সময় বাকি: <span id="countdown" class="font-mono font-bold text-appGreen text-[12px]">--:--:--</span>
                    </div>
                </div>
                
                <div class="flex flex-col items-end gap-1.5 shrink-0">
                    <div class="relative">
                        <button id="locBtn" onclick="toggleLocDropdown()" class="flex items-center gap-1.5 text-[11px] font-semibold text-slate-700 bg-gray-50 hover:bg-gray-100 px-2.5 py-1 rounded-md transition border border-gray-100 min-w-[85px] justify-between">
                            <i class="fa-solid fa-location-dot text-[9px] text-appGreen"></i>
                            <span id="selectedLocText" class="truncate max-w-[60px]">Dhaka</span>
                            <i class="fa-solid fa-chevron-down text-[8px] text-slate-400"></i>
                        </button>
                        <div id="locDropdown" class="hidden absolute right-0 top-full mt-1.5 w-44 bg-white shadow-xl border border-gray-100 rounded-xl p-2 z-[100]">
                            <input type="text" id="locSearch" onkeyup="filterLocations()" placeholder="Search district..." class="w-full bg-gray-50 border border-gray-200 text-[11px] px-2.5 py-1.5 rounded-lg outline-none focus:border-appGreen mb-2">
                            <ul id="locList" class="max-h-40 overflow-y-auto"></ul>
                        </div>
                    </div>
                </div>
            </section>

            <!-- CATEGORY GRID -->
            <section class="bg-white border border-gray-100 rounded-[16px] p-4 shadow-sm z-10 relative">
                <div class="grid grid-cols-4 gap-y-4 gap-x-2">
                    <a href="quran.html" class="cat-item flex flex-col items-center gap-1.5"><div class="icon-box"><i class="fa-solid fa-book-quran"></i></div><span class="text-[10px] font-medium text-gray-700 text-center leading-tight">আল কুরআন</span></a>
                    <a href="quran-translation.html" class="cat-item flex flex-col items-center gap-1.5"><div class="icon-box"><i class="fa-solid fa-book-open-reader"></i></div><span class="text-[10px] font-medium text-gray-700 text-center leading-tight">কুরআন অনুবাদ</span></a>
                    <a href="hadith.html" class="cat-item flex flex-col items-center gap-1.5"><div class="icon-box"><i class="fa-solid fa-book-open"></i></div><span class="text-[10px] font-medium text-gray-700 text-center leading-tight">হাদিস</span></a>
                    
                    <!-- MODAL TRIGGER FOR PRAYER TIMES -->
                    <div onclick="openPrayerModal()" class="cat-item flex flex-col items-center gap-1.5 cursor-pointer"><div class="icon-box"><i class="fa-solid fa-clock"></i></div><span class="text-[10px] font-medium text-gray-700 text-center leading-tight">সময়সূচী</span></div>
                    
                    <a href="tasbeeh.html" class="cat-item flex flex-col items-center gap-1.5"><div class="icon-box"><i class="fa-solid fa-hand-holding-heart"></i></div><span class="text-[10px] font-medium text-gray-700 text-center leading-tight">তাসবীহ</span></a>
                    <a href="makkah-madinah.html" class="cat-item flex flex-col items-center gap-1.5"><div class="icon-box"><i class="fa-solid fa-kaaba"></i></div><span class="text-[10px] font-medium text-gray-700 text-center leading-tight">মক্কা মদিনা</span></a>
                    <a href="namaz-shikha.html" class="cat-item flex flex-col items-center gap-1.5"><div class="icon-box"><i class="fa-solid fa-person-praying"></i></div><span class="text-[10px] font-medium text-gray-700 text-center leading-tight">নামাজ শিক্ষা</span></a>
                    <a href="dua.html" class="cat-item flex flex-col items-center gap-1.5"><div class="icon-box"><i class="fa-solid fa-hands-praying"></i></div><span class="text-[10px] font-medium text-gray-700 text-center leading-tight">দোয়া</span></a>
                </div>

                <div id="extraCategories">
                    <div class="grid grid-cols-4 gap-y-4 gap-x-2 pt-4 border-t border-gray-50 mt-4">
                        <a href="prophets.html" class="cat-item flex flex-col items-center gap-1.5"><div class="icon-box"><i class="fa-solid fa-mosque"></i></div><span class="text-[10px] font-medium text-gray-700 text-center leading-tight">নবীজীদের জীবন</span></a>
                        <a href="calendar.html" class="cat-item flex flex-col items-center gap-1.5"><div class="icon-box"><i class="fa-regular fa-calendar-days"></i></div><span class="text-[10px] font-medium text-gray-700 text-center leading-tight">ক্যালেন্ডার</span></a>
                        <!-- Add other categories as needed -->
                    </div>
                </div>

                <div class="mt-2 flex justify-center pt-2">
                    <button onclick="toggleCategories()" class="text-[11px] text-slate-500 font-semibold flex items-center gap-1.5 active:scale-95 transition bg-gray-50 px-3 py-1.5 rounded-full border border-gray-100">
                        <span id="toggleText">আরও দেখুন</span> <i id="toggleIcon" class="fa-solid fa-chevron-down text-[9px] transition-transform duration-300"></i>
                    </button>
                </div>
            </section>

            <!-- ASMAUL HUSNA -->
            <section class="bg-husnaBg rounded-[16px] p-3 shadow-md text-white relative overflow-hidden">
                <div class="flex items-center gap-2 mb-2 border-b border-white/10 pb-1.5">
                    <i class="fa-solid fa-book-open-reader text-[10px] text-green-200"></i>
                    <h3 class="text-[12px] font-semibold text-green-50 tracking-wide">আসমাউল হুসনা</h3>
                </div>
                <div class="flex items-center justify-between relative z-10 w-full pt-1">
                    <div class="flex flex-col min-h-[46px] justify-center transition-opacity duration-300" id="husnaDisplay">
                        <div class="flex items-end gap-2 flex-wrap mb-1">
                            <span class="text-[22px] font-arabic font-bold leading-none" id="ahArabic">الله</span>
                            <span class="text-[14px] font-bold leading-none mb-0.5" id="ahBangla">আল্লাহ</span>
                            <span class="text-[10px] text-green-200 ml-1 font-mono mb-0.5 bg-black/20 px-1.5 py-0.5 rounded" id="ahCounter">1/99</span>
                        </div>
                        <div class="text-[10px] text-green-50 opacity-90 truncate max-w-[180px]" id="ahMeaning">The Greatest Name</div>
                    </div>
                    
                    <div class="flex items-center gap-2.5 shrink-0">
                        <button onclick="prevName()" class="w-7 h-7 flex justify-center items-center text-white/80 hover:text-white bg-white/10 rounded-full"><i class="fa-solid fa-backward-step text-[10px]"></i></button>
                        <button onclick="toggleAudio()" class="w-9 h-9 bg-white text-husnaBg rounded-full flex justify-center items-center shadow-lg"><i id="playIcon" class="fa-solid fa-play text-[12px] ml-0.5"></i></button>
                        <button onclick="nextName()" class="w-7 h-7 flex justify-center items-center text-white/80 hover:text-white bg-white/10 rounded-full"><i class="fa-solid fa-forward-step text-[10px]"></i></button>
                    </div>
                </div>
                <audio id="husnaAudio" onended="nextName(true)"></audio>
            </section>
        </main>

        <!-- PRAYER TIMES MODAL -->
        <div id="prayerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm px-4">
            <div class="bg-white rounded-2xl p-5 w-full max-w-[320px] shadow-2xl scale-100 transition-transform">
                <div class="flex justify-between items-center mb-4 pb-2 border-b">
                    <h2 class="text-[15px] font-bold text-appGreen flex items-center gap-2"><i class="fa-solid fa-clock"></i> আজকের নামাজের সময়</h2>
                    <button onclick="closePrayerModal()" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div id="modalPrayerList" class="flex flex-col gap-2">
                    <!-- Data will be injected here -->
                </div>
                <button onclick="closePrayerModal()" class="mt-5 w-full bg-appGreen text-white font-medium py-2 rounded-xl active:scale-95 transition">বন্ধ করুন</button>
            </div>
        </div>

    </div>

    <script>
        // --- 1. Toggle Categories ---
        let isExpanded = false;
        function toggleCategories() {
            const extraContainer = document.getElementById('extraCategories');
            const toggleIcon = document.getElementById('toggleIcon');
            isExpanded = !isExpanded;
            extraContainer.style.maxHeight = isExpanded ? extraContainer.scrollHeight + "px" : "0";
            extraContainer.style.opacity = isExpanded ? "1" : "0";
            document.getElementById('toggleText').innerText = isExpanded ? 'কম দেখুন' : 'আরও দেখুন';
            toggleIcon.style.transform = isExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        // --- 2. Location Logic ---
        const bdDistrictsList = ["Dhaka", "Chittagong", "Sylhet", "Rajshahi", "Khulna", "Barisal", "Rangpur", "Mymensingh"]; // Shortened for brevity
        let currentCity = "Dhaka";
        
        function populateLocations() {
            const locList = document.getElementById('locList');
            locList.innerHTML = '';
            bdDistrictsList.forEach(city => {
                let li = document.createElement('li');
                li.className = "text-[11px] font-medium text-gray-700 py-2 px-3 border-b border-gray-50 hover:bg-green-50 hover:text-appGreen cursor-pointer";
                li.innerText = city;
                li.onclick = () => {
                    currentCity = city;
                    document.getElementById('selectedLocText').innerText = city;
                    document.getElementById('locDropdown').classList.add('hidden');
                    fetchPrayerTimes(city); 
                };
                locList.appendChild(li);
            });
        }
        populateLocations();

        function toggleLocDropdown() { document.getElementById('locDropdown').classList.toggle('hidden'); }
        
        document.addEventListener('click', function(e) {
            if (!document.getElementById('locBtn').contains(e.target) && !document.getElementById('locDropdown').contains(e.target)) {
                document.getElementById('locDropdown').classList.add('hidden');
            }
        });

        // --- 3. Prayer Times API & CACHING ---
        let prayerTimesData = {};
        let countdownInterval;
        const bnPrayerNames = { 'Fajr': 'ফজর', 'Sunrise': 'সূর্যোদয়', 'Dhuhr': 'যোহর', 'Asr': 'আসর', 'Maghrib': 'মাগরিব', 'Isha': 'এশা' };

        async function fetchPrayerTimes(city = currentCity) {
            const dateStr = new Date().toISOString().split('T')[0];
            const cacheKey = `prayer_${city}_${dateStr}`;
            
            // Check Local Storage (Cache)
            const cachedData = localStorage.getItem(cacheKey);
            if(cachedData) {
                prayerTimesData = JSON.parse(cachedData);
                calcNextPrayer();
                updateModalData();
                return; // Return early if cached
            }

            try {
                const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=Bangladesh&method=1`);
                const data = await res.json();
                if (data.code === 200) {
                    prayerTimesData = data.data.timings;
                    // Save to Cache
                    localStorage.setItem(cacheKey, JSON.stringify(prayerTimesData));
                    calcNextPrayer();
                    updateModalData();
                }
            } catch (e) { console.error("Error:", e); }
        }

        function format12Hour(timeStr) {
            let [h, m] = timeStr.split(':');
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12; 
            return `${h < 10 ? '0'+h : h}:${m} ${ampm}`;
        }

        function calcNextPrayer() {
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                const now = new Date();
                let nextPrayer = 'Fajr', timeStrForUI = prayerTimesData['Fajr'], nextTime = null;
                const times = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

                for (let pt of times) {
                    if(!prayerTimesData[pt]) continue;
                    let [h, m] = prayerTimesData[pt].split(':');
                    let pTime = new Date(); pTime.setHours(h, m, 0, 0);
                    if (pTime > now) { nextPrayer = pt; nextTime = pTime; timeStrForUI = prayerTimesData[pt]; break; }
                }
                
                if (!nextTime) {
                    let [h, m] = prayerTimesData['Fajr'].split(':');
                    nextTime = new Date(); nextTime.setDate(now.getDate() + 1); nextTime.setHours(h, m, 0, 0);
                }

                document.getElementById('nextPrayerName').innerText = bnPrayerNames[nextPrayer];
                document.getElementById('nextPrayerTime').innerText = `(${format12Hour(timeStrForUI)})`;
                
                let diff = nextTime - now;
                let hL = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
                let mL = Math.floor((diff % (1000*60*60)) / (1000*60));
                let sL = Math.floor((diff % (1000*60)) / 1000);

                document.getElementById('countdown').innerText = `${hL < 10 ? '0'+hL : hL}:${mL < 10 ? '0'+mL : mL}:${sL < 10 ? '0'+sL : sL}`;
            }, 1000);
        }

        // --- 4. MODAL LOGIC ---
        function openPrayerModal() { document.getElementById('prayerModal').classList.remove('hidden'); }
        function closePrayerModal() { document.getElementById('prayerModal').classList.add('hidden'); }
        function updateModalData() {
            const modalList = document.getElementById('modalPrayerList');
            const mainTimes = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
            let html = '';
            mainTimes.forEach(t => {
                if(prayerTimesData[t]) {
                    html += `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <span class="text-[14px] font-bold text-gray-700">${bnPrayerNames[t]}</span>
                        <span class="text-[13px] font-mono font-semibold text-appGreen">${format12Hour(prayerTimesData[t])}</span>
                    </div>`;
                }
            });
            modalList.innerHTML = html;
        }

        // --- 5. Asmaul Husna API & CACHING ---
        let husnaNames = [];
        let currentHusnaIndex = 0;
        let isPlaying = false;
        const audioElement = document.getElementById('husnaAudio');

        async function fetchHusna() {
            // Check Local Storage (Cache)
            const cachedHusna = localStorage.getItem('asmaul_husna');
            if(cachedHusna) {
                husnaNames = JSON.parse(cachedHusna);
                updateHusnaUI();
                return;
            }

            try {
                const res = await fetch('https://api.aladhan.com/v1/asmaAlHusna');
                const data = await res.json();
                if(data.code === 200) {
                    husnaNames = data.data;
                    localStorage.setItem('asmaul_husna', JSON.stringify(husnaNames)); // Save to Cache
                    updateHusnaUI();
                }
            } catch (e) { console.error("Error:", e); }
        }

        function updateHusnaUI() {
            if(husnaNames.length === 0) return;
            const item = husnaNames[currentHusnaIndex];
            document.getElementById('ahArabic').innerText = item.name;
            document.getElementById('ahBangla').innerText = item.transliteration;
            document.getElementById('ahMeaning').innerText = item.en.meaning;
            document.getElementById('ahCounter').innerText = `${item.number}/99`;
            
            audioElement.src = `https://raw.githubusercontent.com/islamic-network/cdn/master/asmaAlHusna/audio/${item.number}.mp3`;
            if(isPlaying) audioElement.play();
        }

        function toggleAudio() {
            isPlaying = !isPlaying;
            document.getElementById('playIcon').className = isPlaying ? 'fa-solid fa-pause text-[12px]' : 'fa-solid fa-play text-[12px] ml-0.5';
            isPlaying ? audioElement.play() : audioElement.pause();
        }

        function nextName(autoPlay = false) { currentHusnaIndex = (currentHusnaIndex + 1) % 99; if(autoPlay) isPlaying = true; updateHusnaUI(); }
        function prevName() { currentHusnaIndex = (currentHusnaIndex - 1 + 99) % 99; updateHusnaUI(); }

        // Init App
        fetchPrayerTimes();
        fetchHusna();
    </script>
</body>
</html>
