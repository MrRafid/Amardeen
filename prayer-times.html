<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নামাজের সময়সূচী</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { background-color: #f4f5f7; font-family: 'Hind Siliguri', sans-serif; max-width: 400px; margin: 0 auto; }</style>
</head>
<body class="bg-gray-50 p-4">

    <div class="flex items-center gap-4 mb-6 mt-2">
        <button onclick="window.history.back()" class="w-8 h-8 bg-white rounded-full shadow flex justify-center items-center text-gray-600"><i class="fa-solid fa-arrow-left"></i></button>
        <h1 class="text-lg font-bold text-slate-800">নামাজের বিস্তারিত সময়সূচী</h1>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 text-center">
        <p class="text-sm text-gray-500 mb-2">পরবর্তী ওয়াক্ত</p>
        <h2 id="nextPrayerName" class="text-3xl font-bold text-[#238968] mb-1">--</h2>
        <p id="nextPrayerTime" class="text-lg font-mono text-gray-600 font-semibold">--:--</p>
        <div class="mt-4 bg-green-50 p-3 rounded-xl border border-green-100">
            <p class="text-xs text-green-700">সময় বাকি আছে</p>
            <h3 id="countdown" class="text-2xl font-bold font-mono text-[#238968]">--:--:--</h3>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
