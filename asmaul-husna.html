<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আসমাউল হুসনা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <style>body { background-color: #f4f5f7; font-family: 'Hind Siliguri', sans-serif; max-width: 400px; margin: 0 auto; }</style>
</head>
<body class="bg-gray-50 p-4">

    <div class="flex items-center gap-4 mb-6 mt-2">
        <button onclick="window.history.back()" class="w-8 h-8 bg-white rounded-full shadow flex justify-center items-center text-gray-600"><i class="fa-solid fa-arrow-left"></i></button>
        <h1 class="text-lg font-bold text-slate-800">আসমাউল হুসনা</h1>
    </div>

    <div class="bg-[#1b6b5c] p-8 rounded-3xl shadow-lg text-center text-white mt-10">
        <div id="husnaDisplay" class="transition-opacity duration-300 min-h-[150px] flex flex-col justify-center items-center">
            <h2 id="ahArabic" class="text-6xl font-[Amiri] mb-4">الله</h2>
            <h3 id="ahBangla" class="text-2xl font-bold mb-2">আল্লাহ</h3>
            <p id="ahMeaning" class="text-sm text-green-100 opacity-90 mb-4">The Greatest Name</p>
            <span id="ahCounter" class="text-xs bg-black/30 px-3 py-1 rounded-full font-mono">1/99</span>
        </div>
        
        <div class="flex justify-center items-center gap-6 mt-8">
            <button onclick="prevName()" class="w-12 h-12 bg-white/10 rounded-full flex justify-center items-center hover:bg-white/20 active:scale-95 transition"><i class="fa-solid fa-backward-step"></i></button>
            <button onclick="toggleAudio()" class="w-16 h-16 bg-white text-[#1b6b5c] rounded-full flex justify-center items-center shadow-xl active:scale-90 transition"><i id="playIcon" class="fa-solid fa-play text-xl ml-1"></i></button>
            <button onclick="nextName()" class="w-12 h-12 bg-white/10 rounded-full flex justify-center items-center hover:bg-white/20 active:scale-95 transition"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
