<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>আল কুরআন</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { teal: { DEFAULT: '#1a897e', light: '#e8f4f3', active: '#f0f9f8' } },
                    fontFamily: { bangla: ['Noto Sans Bengali', 'sans-serif'], arabic: ['Amiri', 'serif'] },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out forwards' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f7f9fa; }
        .arabic-text { font-family: 'Amiri', serif; line-height: 1.8; }
        ::-webkit-scrollbar { display: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-list > div { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
        
        /* Minimal Islamic Star */
        .islamic-star {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23e8f4f3" d="M50 0 L65 15 L100 15 L85 50 L100 85 L65 85 L50 100 L35 85 L0 85 L15 50 L0 15 L35 15 Z"/></svg>');
            background-size: cover; background-position: center;
        }

        /* Active Playing Card Style */
        .playing-card {
            background-color: #f0f9f8 !important;
            border-color: #a7d7d2 !important;
            box-shadow: 0 4px 12px rgba(26, 137, 126, 0.1) !important;
            transform: scale(1.01);
            transition: all 0.3s ease-in-out;
            z-index: 10;
        }

        /* Playing Equalizer Animation */
        .equalizer { display: none; align-items: flex-end; gap: 2px; height: 12px; }
        .playing-card .equalizer { display: flex; }
        .equalizer span { width: 3px; background-color: #1a897e; border-radius: 2px; animation: bounce 1s infinite ease-in-out; }
        .equalizer span:nth-child(2) { animation-delay: 0.2s; }
        .equalizer span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 100% { height: 4px; } 50% { height: 12px; } }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 px-3 py-3 flex items-center gap-3 shadow-sm border-b border-gray-100">
        <button id="btn-back" class="text-gray-500 hidden p-1.5 active:scale-95 transition-transform bg-gray-50 rounded-full" onclick="navigateBack()">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <h1 id="header-title" class="text-[17px] font-semibold text-gray-800">আল কুরআন</h1>
    </header>

    <!-- Main Lists View -->
    <main id="main-container">
        <!-- Tabs -->
        <div class="px-3 pt-3 pb-2 bg-white sticky top-[53px] z-30 shadow-[0_2px_10px_rgba(0,0,0,0.02)]" id="tabs-container">
            <div class="flex gap-1 justify-center bg-gray-100/80 p-1 rounded-full border border-gray-200/60">
                <button onclick="switchTab('home')" id="tab-home" class="flex-1 py-1.5 text-[14px] font-medium rounded-full transition-all text-gray-500">হোম</button>
                <button onclick="switchTab('surah')" id="tab-surah" class="flex-1 py-1.5 text-[14px] font-medium rounded-full transition-all bg-teal text-white shadow-sm">সূরা</button>
                <button onclick="switchTab('para')" id="tab-para" class="flex-1 py-1.5 text-[14px] font-medium rounded-full transition-all text-gray-500">পারা</button>
            </div>
        </div>

        <div class="px-3 py-3 hidden animate-list" id="view-home">
            <div id="history-list" class="flex flex-col gap-2"></div>
            <p id="empty-history" class="text-[13px] text-gray-400 text-center mt-10">কোনো হিস্ট্রি নেই</p>
        </div>

        <div class="px-3 py-3 animate-list" id="view-surah">
            <div id="surah-list" class="flex flex-col gap-2">
                <div class="text-center py-10 text-teal"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto"></i></div>
            </div>
        </div>

        <div class="px-3 py-3 hidden animate-list" id="view-para">
            <div id="para-list" class="flex flex-col gap-2"></div>
        </div>
    </main>

    <!-- Reader View -->
    <main id="reader-container" class="hidden relative">
        <div id="reader-header" class="sticky top-[53px] z-30 bg-teal-light/95 backdrop-blur-sm border-b border-teal-200/50 shadow-sm transition-all duration-300">
            <div class="flex justify-between items-center px-4 py-2">
                <span id="reader-revelation" class="text-[10px] font-medium text-teal px-2 py-0.5 bg-white/80 rounded-md">মাক্কী</span>
                <div class="text-center">
                    <div id="reader-title" class="font-bold text-[15px] text-teal leading-tight">আল ফাতিহা</div>
                    <div id="reader-subtitle" class="text-[10px] text-teal/70">সূচনা</div>
                </div>
                <span id="reader-count" class="text-[10px] font-medium text-teal px-2 py-0.5 bg-white/80 rounded-md">৭ আয়াত</span>
            </div>
        </div>

        <!-- Verses -->
        <div id="verses-container" class="px-2 py-3 flex flex-col gap-2.5"></div>
        
        <div id="reader-loading" class="text-center py-12 text-teal hidden flex-col items-center">
            <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>
            <p class="mt-2 text-[13px] font-medium">আয়াত প্রস্তুত হচ্ছে...</p>
        </div>
    </main>

    <!-- Floating Minimal Player -->
    <div id="bottom-player" class="fixed bottom-3 left-3 right-3 bg-white border border-teal-100 rounded-2xl px-4 py-3 shadow-[0_8px_20px_rgba(26,137,126,0.15)] z-50 flex items-center justify-between transition-transform transform translate-y-[150%] duration-300">
        <div class="flex flex-col flex-1 truncate pr-2">
            <span id="player-title" class="font-bold text-[14px] text-teal truncate">আল ফাতিহা</span>
            <span id="player-subtitle" class="text-[11px] text-gray-500 font-medium">আয়াত ১</span>
        </div>
        <button id="btn-play-pause" onclick="togglePlayPause()" class="w-11 h-11 shrink-0 flex items-center justify-center rounded-full bg-teal text-white shadow-md active:scale-90 transition-transform">
            <i data-lucide="pause" id="icon-play-pause" class="w-5 h-5 fill-current"></i>
        </button>
    </div>

    <!-- Background Double Buffering Engines -->
    <audio id="audio-1" preload="auto"></audio>
    <audio id="audio-2" preload="auto"></audio>

    <script>
        const API_BASE = 'https://api.quran.com/api/v4';
        const BANGLA_DIGITS = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        const toBnNum = num => num.toString().replace(/\d/g, d => BANGLA_DIGITS[d]);

        // Deep State Management
        let state = {
            surahs: [], paras: [], currentTab: 'surah', 
            playlist: [], nextPlaylist: null, // For gapless chapter transition
            currentAudioIndex: -1, activeAudioTag: 1, isPlaying: false,
            currentId: 1, currentType: 'surah', currentMeta: null,
            needsUIRender: false // For background UI sync
        };

        const elements = {
            audio1: document.getElementById('audio-1'), audio2: document.getElementById('audio-2'),
            bottomPlayer: document.getElementById('bottom-player'), iconPlayPause: document.getElementById('icon-play-pause')
        };

        async function init() {
            lucide.createIcons();
            setupAudioEngine();
            generateParas();
            loadHistory();
            await fetchSurahs();
            switchTab('surah');

            // Sync UI when returning from background
            document.addEventListener("visibilitychange", () => {
                if(document.visibilityState === 'visible' && state.needsUIRender) {
                    renderVerses(state.playlist, state.currentMeta);
                    updatePlayerUI(state.playlist[state.currentAudioIndex]);
                    state.needsUIRender = false;
                }
            });
        }

        // --- NAVIGATION ---
        function switchTab(tab) {
            state.currentTab = tab;
            ['home', 'surah', 'para'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-1.5 text-[14px] font-medium rounded-full transition-all bg-teal text-white shadow-sm";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "flex-1 py-1.5 text-[14px] font-medium rounded-full transition-all text-gray-500 bg-transparent";
                    view.classList.add('hidden');
                }
            });
            if(tab === 'home') loadHistory();
        }

        function navigateBack() {
            document.getElementById('main-container').classList.remove('hidden');
            document.getElementById('reader-container').classList.add('hidden');
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('header-title').textContent = "আল কুরআন";
            pauseCurrentAudio();
            elements.bottomPlayer.classList.add('translate-y-[150%]');
            if(state.currentTab === 'home') loadHistory();
        }

        // --- INITIAL DATA FETCH ---
        async function fetchSurahs() {
            if(sessionStorage.getItem('q_surahs')) {
                state.surahs = JSON.parse(sessionStorage.getItem('q_surahs'));
                renderSurahs(state.surahs);
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/chapters?language=bn`);
                const data = await res.json();
                state.surahs = data.chapters;
                sessionStorage.setItem('q_surahs', JSON.stringify(state.surahs));
                renderSurahs(state.surahs);
            } catch (error) {
                document.getElementById('surah-list').innerHTML = `<p class="text-red-500 text-[13px] text-center">ডেটা লোড ব্যর্থ। ইন্টারনেট চেক করুন।</p>`;
            }
        }

        function generateParas() {
            for(let i=1; i<=30; i++) state.paras.push({ id: i, name: `পারা ${toBnNum(i)}` });
            renderParas(state.paras);
        }

        function renderSurahs(surahs) {
            let html = '';
            surahs.forEach((surah, index) => {
                html += `
                <div onclick="openReader(${surah.id}, 'surah')" class="bg-white rounded-xl shadow-sm border border-gray-100/50 p-2.5 flex items-center justify-between cursor-pointer active:bg-teal-50 transition-colors" style="animation-delay: ${index * 0.02}s">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 islamic-star flex items-center justify-center font-bold text-teal text-[13px] shrink-0 pt-0.5 shadow-sm">${toBnNum(surah.id)}</div>
                        <div class="flex flex-col">
                            <span class="font-semibold text-[15px] text-gray-800 leading-tight">${surah.name_complex || surah.name_arabic}</span>
                            <span class="text-[11px] text-gray-400 mt-0.5">${surah.translated_name.name} • ${toBnNum(surah.verses_count)} আয়াত</span>
                        </div>
                    </div>
                    <div class="text-teal text-xl arabic-text font-bold pr-2 opacity-90">${surah.name_arabic}</div>
                </div>`;
            });
            document.getElementById('surah-list').innerHTML = html;
        }

        function renderParas(paras) {
            let html = '';
            paras.forEach((para, index) => {
                html += `
                <div onclick="openReader(${para.id}, 'para')" class="bg-white rounded-xl shadow-sm border border-gray-100/50 p-3 flex items-center justify-between cursor-pointer active:bg-teal-50 transition-colors" style="animation-delay: ${index * 0.02}s">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 islamic-star flex items-center justify-center font-bold text-teal text-[13px] shrink-0 pt-0.5 shadow-sm">${toBnNum(para.id)}</div>
                        <span class="font-semibold text-[15px] text-gray-800">${para.name}</span>
                    </div>
                    <i data-lucide="chevron-right" class="text-teal/40 w-5 h-5"></i>
                </div>`;
            });
            document.getElementById('para-list').innerHTML = html;
            lucide.createIcons();
        }

        // --- HISTORY ---
        function saveToHistory(id, type) {
            let history = JSON.parse(localStorage.getItem('q_hist') || '[]');
            history = history.filter(h => h.id !== id || h.type !== type);
            history.unshift({id, type});
            if(history.length > 8) history.pop();
            localStorage.setItem('q_hist', JSON.stringify(history));
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('q_hist') || '[]');
            const list = document.getElementById('history-list');
            if(history.length === 0) {
                list.innerHTML = '';
                return document.getElementById('empty-history').classList.remove('hidden');
            }
            
            document.getElementById('empty-history').classList.add('hidden');
            let html = '';
            history.forEach((h, index) => {
                const item = h.type === 'surah' ? state.surahs.find(s => s.id === h.id) : state.paras.find(p => p.id === h.id);
                if(!item) return;
                const isSurah = h.type === 'surah';
                html += `
                <div onclick="openReader(${item.id}, '${h.type}')" class="bg-white rounded-xl shadow-sm border border-gray-100/50 p-2.5 flex items-center gap-3 cursor-pointer active:bg-teal-50" style="animation-delay: ${index * 0.05}s">
                    <div class="w-10 h-10 islamic-star flex items-center justify-center font-bold text-teal text-[13px] shrink-0 pt-0.5">${toBnNum(item.id)}</div>
                    <div class="flex flex-col">
                        <span class="font-semibold text-[15px]">${isSurah ? (item.name_complex || item.name_arabic) : item.name}</span>
                        <span class="text-[11px] text-gray-400">${isSurah ? item.translated_name.name : 'পারা'}</span>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
        }

        // --- DATA ENGINE (Preloading & Gapless) ---
        async function fetchPlaylistData(id, type, meta) {
            let allVerses = [];
            let page = 1; let totalPages = 1;
            const endpoint = type === 'surah' ? `verses/by_chapter/${id}` : `verses/by_juz/${id}`;

            while (page <= totalPages) {
                const res = await fetch(`${API_BASE}/${endpoint}?language=bn&words=false&translations=161&fields=text_uthmani&audio=7&per_page=100&page=${page}`);
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                allVerses = allVerses.concat(data.verses);
                totalPages = data.pagination.total_pages;
                page++;
            }

            return allVerses.map((v, i) => ({
                id: v.id, ayahNum: v.verse_number, textAr: v.text_uthmani, textBn: v.translations[0].text,
                url: v.audio?.url ? (v.audio.url.startsWith('//') ? 'https:'+v.audio.url : (v.audio.url.startsWith('http') ? v.audio.url : 'https://verses.quran.com/'+v.audio.url)) : null,
                surahName: type === 'surah' ? (meta.name_complex || meta.name_arabic) : meta.name, 
                globalIndex: i
            }));
        }

        async function openReader(id, type) {
            const meta = type === 'surah' ? state.surahs.find(s=>s.id===id) : state.paras.find(p=>p.id===id);
            if(!meta) return;

            state.currentId = id; state.currentType = type; state.currentMeta = meta;
            state.nextPlaylist = null; // Reset preloaded data

            document.getElementById('main-container').classList.add('hidden');
            document.getElementById('reader-container').classList.remove('hidden');
            document.getElementById('btn-back').classList.remove('hidden');
            
            // Set Header Texts
            document.getElementById('header-title').textContent = type === 'surah' ? (meta.name_complex || meta.name_arabic) : meta.name;
            document.getElementById('reader-title').textContent = type === 'surah' ? (meta.name_complex || meta.name_arabic) : meta.name;
            document.getElementById('reader-subtitle').textContent = type === 'surah' ? meta.translated_name.name : 'আল কুরআন';
            document.getElementById('reader-revelation').textContent = type === 'surah' ? (meta.revelation_place === 'makkah' ? 'মাক্কী' : 'মাদানী') : '';
            document.getElementById('reader-count').textContent = type === 'surah' ? `${toBnNum(meta.verses_count)} আয়াত` : '';
            document.getElementById('reader-revelation').style.display = type === 'para' ? 'none' : 'block';
            document.getElementById('reader-count').style.display = type === 'para' ? 'none' : 'block';

            saveToHistory(id, type);
            
            const container = document.getElementById('verses-container');
            const loading = document.getElementById('reader-loading');
            container.innerHTML = '';
            loading.classList.remove('hidden'); loading.style.display = 'flex';

            try {
                state.playlist = await fetchPlaylistData(id, type, meta);
                loading.classList.add('hidden'); loading.style.display = 'none';
                renderVerses(state.playlist, meta);
                
                // PRELOAD NEXT CHAPTER IN BACKGROUND IMMIDIATELY
                preloadNextChapterData();
            } catch (error) {
                loading.style.display = 'none';
                container.innerHTML = `<div class="text-red-500 text-[13px] text-center bg-red-50 p-3 rounded-lg border border-red-100">ডেটা লোড করতে সমস্যা হয়েছে।</div>`;
            }
        }

        async function preloadNextChapterData() {
            const nextId = state.currentId + 1;
            const limit = state.currentType === 'surah' ? 114 : 30;
            if (nextId <= limit) {
                const nextMeta = state.currentType === 'surah' ? state.surahs.find(s=>s.id===nextId) : state.paras.find(p=>p.id===nextId);
                try {
                    state.nextPlaylist = await fetchPlaylistData(nextId, state.currentType, nextMeta);
                    console.log("Next chapter preloaded in memory for gapless playback");
                } catch(e) { console.log("Failed to preload next chapter", e); }
            }
        }

        function renderVerses(playlist, meta) {
            let html = '';
            if(state.currentType === 'surah' && state.currentId !== 1 && state.currentId !== 9) {
                html += `<div class="text-center mb-2 mt-1"><img src="https://assets.quran.com/images/bismillah.svg" alt="Bismillah" class="h-9 mx-auto opacity-70" style="filter: invert(41%) sepia(86%) saturate(417%) hue-rotate(124deg) brightness(88%) contrast(85%);"></div>`;
            }

            playlist.forEach(verse => {
                html += `
                <div id="verse-card-${verse.globalIndex}" onclick="playVerse(${verse.globalIndex})" class="verse-card bg-white rounded-xl shadow-sm border border-gray-100 p-3.5 cursor-pointer active:scale-[0.99] transition-all duration-300">
                    <div class="flex justify-between items-start mb-2 gap-3">
                        <div class="w-7 h-7 rounded-full border border-teal-100 flex items-center justify-center text-[11px] font-bold text-teal bg-teal-50 shrink-0 pt-0.5 shadow-sm">${toBnNum(verse.ayahNum)}</div>
                        <div class="text-right flex-1 min-w-0">
                            <p class="arabic-text text-[22px] font-bold text-gray-800 leading-normal">${verse.textAr}</p>
                        </div>
                    </div>
                    <div class="pt-2 flex justify-between items-end">
                        <p class="text-gray-600 text-[13.5px] leading-relaxed flex-1 pr-2">${verse.textBn.replace(/<sup.*?<\/sup>/g, '')}</p>
                        <!-- Equalizer / Icon -->
                        <div class="shrink-0 h-6 w-6 flex items-center justify-center rounded-full bg-teal-50 text-teal">
                            <i data-lucide="play" class="w-3 h-3 fill-current play-icon"></i>
                            <div class="equalizer"><span></span><span></span><span></span></div>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById('verses-container').innerHTML = html;
            lucide.createIcons();
        }

        // --- ADVANCED AUDIO ENGINE (Deep Background Fix) ---
        function setupAudioEngine() {
            elements.audio1.addEventListener('ended', handleTrackEnd);
            elements.audio2.addEventListener('ended', handleTrackEnd);
            
            // Error handling for dead links to prevent stops
            elements.audio1.addEventListener('error', () => { if(state.isPlaying) handleTrackEnd(); });
            elements.audio2.addEventListener('error', () => { if(state.isPlaying) handleTrackEnd(); });

            elements.audio1.addEventListener('play', () => setPlayingUI(true));
            elements.audio2.addEventListener('play', () => setPlayingUI(true));
            elements.audio1.addEventListener('pause', () => setPlayingUI(false));
            elements.audio2.addEventListener('pause', () => setPlayingUI(false));

            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', togglePlayPause);
                navigator.mediaSession.setActionHandler('pause', togglePlayPause);
                navigator.mediaSession.setActionHandler('previoustrack', () => playVerse(state.currentAudioIndex - 1));
                navigator.mediaSession.setActionHandler('nexttrack', () => handleTrackEnd()); // Next works like end
            }
        }

        function playVerse(index) {
            if (index < 0 || index >= state.playlist.length) return;
            state.currentAudioIndex = index;
            const track = state.playlist[index];
            if(!track.url) { handleTrackEnd(); return; } // Skip empty

            state.activeAudioTag = 1;
            elements.audio1.src = track.url;
            elements.audio1.play().catch(e => console.log(e));
            
            updatePlayerUI(track);
            preloadNextVerse();
        }

        function handleTrackEnd() {
            let nextIndex = state.currentAudioIndex + 1;
            let currentList = state.playlist;

            // Check if current chapter ended
            if (nextIndex >= currentList.length) {
                if (state.nextPlaylist && state.nextPlaylist.length > 0) {
                    // GAPLESS CHAPTER SWAP
                    state.playlist = state.nextPlaylist;
                    state.currentId += 1;
                    state.currentMeta = state.currentType === 'surah' ? state.surahs.find(s=>s.id===state.currentId) : state.paras.find(p=>p.id===state.currentId);
                    
                    nextIndex = 0;
                    currentList = state.playlist;
                    
                    // Trigger UI render if screen is on, else flag it
                    if (document.visibilityState === 'visible') {
                        renderVerses(state.playlist, state.currentMeta);
                        updateHeaderUIForNextChapter();
                    } else {
                        state.needsUIRender = true;
                    }
                    
                    // Preload next next chapter
                    preloadNextChapterData();
                } else {
                    setPlayingUI(false);
                    return; // End of Quran or next not ready
                }
            }

            state.currentAudioIndex = nextIndex;
            state.activeAudioTag = state.activeAudioTag === 1 ? 2 : 1;
            const activeEl = state.activeAudioTag === 1 ? elements.audio1 : elements.audio2;
            
            // Failsafe: if preload failed, set src now synchronously
            if (!activeEl.src.endsWith(currentList[nextIndex].url.split('/').pop())) {
                activeEl.src = currentList[nextIndex].url;
            }

            // Must call play synchronously inside the ended event listener for iOS background compliance
            activeEl.play().catch(e => {
                console.log("Background play blocked, attempting skip", e);
                setTimeout(handleTrackEnd, 500); // Try next if blocked
            });
            
            try { updatePlayerUI(currentList[nextIndex]); } catch(e){} // Safe UI update
            preloadNextVerse();
        }

        function preloadNextVerse() {
            const next = state.currentAudioIndex + 1;
            if (next < state.playlist.length && state.playlist[next].url) {
                const inactiveEl = state.activeAudioTag === 1 ? elements.audio2 : elements.audio1;
                inactiveEl.src = state.playlist[next].url; 
                inactiveEl.load(); // Fetch implicitly
            }
        }

        function updateHeaderUIForNextChapter() {
            const meta = state.currentMeta;
            document.getElementById('header-title').textContent = state.currentType === 'surah' ? (meta.name_complex || meta.name_arabic) : meta.name;
            document.getElementById('reader-title').textContent = state.currentType === 'surah' ? (meta.name_complex || meta.name_arabic) : meta.name;
            document.getElementById('reader-subtitle').textContent = state.currentType === 'surah' ? meta.translated_name.name : 'আল কুরআন';
            document.getElementById('reader-revelation').textContent = state.currentType === 'surah' ? (meta.revelation_place === 'makkah' ? 'মাক্কী' : 'মাদানী') : '';
            document.getElementById('reader-count').textContent = state.currentType === 'surah' ? `${toBnNum(meta.verses_count)} আয়াত` : '';
        }

        function updatePlayerUI(track) {
            elements.bottomPlayer.classList.remove('translate-y-[150%]');
            document.getElementById('player-title').textContent = track.surahName;
            document.getElementById('player-subtitle').textContent = `আয়াত ${toBnNum(track.ayahNum)}`;

            if (document.visibilityState === 'visible' && !state.needsUIRender) {
                // Reset styling
                document.querySelectorAll('.verse-card').forEach(el => {
                    el.classList.remove('playing-card');
                    el.querySelector('.play-icon').style.display = 'block';
                });

                // Apply active styling
                const card = document.getElementById(`verse-card-${track.globalIndex}`);
                if (card) {
                    card.classList.add('playing-card');
                    card.querySelector('.play-icon').style.display = 'none';
                    
                    // Smooth Auto-Center
                    const headerOffset = 120;
                    const elementPosition = card.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                    window.scrollTo({ top: offsetPosition, behavior: "smooth" });
                }
            }

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: `আয়াত ${toBnNum(track.ayahNum)}`,
                    artist: track.surahName,
                    album: 'আল কুরআন'
                });
            }
        }

        function setPlayingUI(isP) {
            state.isPlaying = isP;
            elements.iconPlayPause.setAttribute('data-lucide', isP ? 'pause' : 'play');
            lucide.createIcons();
            
            // Pause animation if paused
            if(document.visibilityState === 'visible') {
                document.querySelectorAll('.equalizer span').forEach(s => {
                    s.style.animationPlayState = isP ? 'running' : 'paused';
                });
            }
        }

        function togglePlayPause() {
            if (state.currentAudioIndex === -1 && state.playlist.length > 0) return playVerse(0);
            const activeEl = state.activeAudioTag === 1 ? elements.audio1 : elements.audio2;
            if (state.isPlaying) activeEl.pause();
            else activeEl.play().catch(e=>console.log(e));
        }

        function pauseCurrentAudio() {
            elements.audio1.pause(); elements.audio2.pause(); setPlayingUI(false);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
