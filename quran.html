<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>আল কুরআন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { teal: { DEFAULT: '#1a897e', light: '#eef6f5' } },
                    fontFamily: { bangla: ['Noto Sans Bengali', 'sans-serif'], arabic: ['Amiri', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f7f9f9; }
        .arabic-text { font-family: 'Amiri', serif; line-height: 1.8; }
        ::-webkit-scrollbar { display: none; }
        
        /* Compact Hexagon */
        .islamic-star {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23eef6f5" d="M50 0 L65 15 L100 15 L85 50 L100 85 L65 85 L50 100 L35 85 L0 85 L15 50 L0 15 L35 15 Z"/></svg>');
            background-size: cover; background-position: center;
        }

        /* Minimal Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.25s ease-out forwards; }
        
        .active-card {
            background-color: #f4fafa !important;
            border-color: #c4e4e1 !important;
            transform: scale(1.005);
        }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <!-- Compact Header -->
    <header class="bg-white sticky top-0 z-40 px-3 py-2.5 flex items-center gap-3 shadow-[0_1px_4px_rgba(0,0,0,0.03)] border-b border-gray-100">
        <button id="btn-back" class="hidden p-1 active:scale-90 transition-transform text-gray-500" onclick="navigateBack()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 id="header-title" class="text-[16px] font-semibold text-gray-800">আল কুরআন</h1>
    </header>

    <!-- Main Container -->
    <main id="main-container">
        <!-- Compact Tabs -->
        <div class="px-3 py-2.5 bg-white shadow-sm border-b border-gray-50" id="tabs-container">
            <div class="flex justify-center bg-gray-50/80 p-1 rounded-full border border-gray-100">
                <button onclick="switchTab('home')" id="tab-home" class="flex-1 py-1 text-[13px] font-medium rounded-full transition-colors text-gray-500">হোম</button>
                <button onclick="switchTab('surah')" id="tab-surah" class="flex-1 py-1 text-[13px] font-medium rounded-full transition-colors bg-teal text-white shadow-sm">সূরা</button>
                <button onclick="switchTab('para')" id="tab-para" class="flex-1 py-1 text-[13px] font-medium rounded-full transition-colors text-gray-500">পারা</button>
            </div>
        </div>

        <div class="px-3 py-2 hidden fade-in" id="view-home">
            <div id="history-list" class="flex flex-col gap-1.5"></div>
            <p id="empty-history" class="text-center text-[12px] text-gray-400 mt-6 hidden">কোনো হিস্ট্রি নেই</p>
        </div>

        <div class="px-3 py-2 fade-in" id="view-surah">
            <div id="surah-list" class="flex flex-col gap-1.5">
                <div class="text-center py-8 text-teal">
                    <svg class="w-5 h-5 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </div>
            </div>
        </div>

        <div class="px-3 py-2 hidden fade-in" id="view-para">
            <div id="para-list" class="flex flex-col gap-1.5"></div>
        </div>
    </main>

    <!-- Reader Container -->
    <main id="reader-container" class="hidden relative">
        <div class="sticky top-[45px] z-30 bg-teal-light/95 backdrop-blur border-b border-teal-200/50">
            <div class="flex justify-between items-center px-3 py-1.5">
                <span id="reader-revelation" class="text-[9px] font-semibold text-teal px-2 py-0.5 bg-white rounded shadow-sm">মাক্কী</span>
                <div class="text-center flex flex-col items-center">
                    <span id="reader-title" class="font-bold text-[14px] text-teal leading-tight">আল ফাতিহা</span>
                    <span id="reader-subtitle" class="text-[10px] text-teal/80 mt-0.5">সূচনা</span>
                </div>
                <span id="reader-count" class="text-[9px] font-semibold text-teal px-2 py-0.5 bg-white rounded shadow-sm">৭ আয়াত</span>
            </div>
        </div>

        <div id="verses-container" class="px-2.5 py-2.5 flex flex-col gap-2"></div>
        
        <div id="reader-loading" class="text-center py-10 text-teal hidden flex-col items-center">
            <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="mt-2 text-[12px]">লোড হচ্ছে...</p>
        </div>
    </main>

    <!-- Sleek Bottom Player -->
    <div id="bottom-player" class="fixed bottom-3 left-3 right-3 bg-white border border-gray-100 rounded-xl px-3 py-2 shadow-[0_4px_15px_rgba(0,0,0,0.05)] z-50 flex items-center justify-between transition-transform transform translate-y-[150%] duration-300">
        <div class="flex flex-col truncate pr-2">
            <span id="player-title" class="font-bold text-[13px] text-gray-800 truncate">আল ফাতিহা</span>
            <span id="player-subtitle" class="text-[10px] text-teal font-medium mt-0.5">আয়াত ১</span>
        </div>
        
        <!-- Toggle Button (Instant SVG Change) -->
        <button id="btn-play-pause" onclick="togglePlayPause()" class="w-9 h-9 shrink-0 flex items-center justify-center rounded-full bg-teal text-white shadow active:scale-90 transition-transform">
            <!-- Play Icon -->
            <svg id="icon-play" class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <!-- Pause Icon (Hidden initially) -->
            <svg id="icon-pause" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
    </div>

    <!-- Background Audio Elements -->
    <audio id="audio-1" preload="auto"></audio>
    <audio id="audio-2" preload="auto"></audio>

    <script>
        const API = 'https://api.quran.com/api/v4';
        const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        const tbn = num => num.toString().replace(/\d/g, d => bnDigits[d]);

        let st = {
            surahs: [], paras: [], tab: 'surah',
            queue: [], pIdx: -1, aTag: 1, isP: false, isF: false,
            uId: null, uType: 'surah'
        };

        const dom = {
            a1: document.getElementById('audio-1'), a2: document.getElementById('audio-2'),
            p: document.getElementById('bottom-player'),
            iPlay: document.getElementById('icon-play'), iPause: document.getElementById('icon-pause')
        };

        async function init() {
            setupAudio();
            genParas();
            loadHist();
            await loadSurahs();
            switchTab('surah');

            document.addEventListener("visibilitychange", () => {
                if(document.visibilityState === 'visible' && st.pIdx >= 0) {
                    const track = st.queue[st.pIdx];
                    if(track.sId !== st.uId) renderReaderUI(track.sId, track.type);
                    else updatePlayerUI(track, false);
                }
            });
        }

        // --- UI Nav ---
        function switchTab(t) {
            st.tab = t;
            ['home', 'surah', 'para'].forEach(x => {
                const b = document.getElementById(`tab-${x}`);
                const v = document.getElementById(`view-${x}`);
                if (x === t) {
                    b.className = "flex-1 py-1 text-[13px] font-medium rounded-full transition-colors bg-teal text-white shadow-sm";
                    v.classList.remove('hidden');
                } else {
                    b.className = "flex-1 py-1 text-[13px] font-medium rounded-full transition-colors text-gray-500 bg-transparent";
                    v.classList.add('hidden');
                }
            });
            if(t === 'home') loadHist();
        }

        function navigateBack() {
            document.getElementById('main-container').classList.remove('hidden');
            document.getElementById('reader-container').classList.add('hidden');
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('header-title').textContent = "আল কুরআন";
            if(st.tab === 'home') loadHist();
        }

        // --- Data Fetch ---
        async function loadSurahs() {
            if(localStorage.getItem('qs3')) {
                st.surahs = JSON.parse(localStorage.getItem('qs3'));
                renderSurahs(st.surahs); return;
            }
            try {
                const res = await fetch(`${API}/chapters?language=bn`);
                st.surahs = (await res.json()).chapters;
                localStorage.setItem('qs3', JSON.stringify(st.surahs));
                renderSurahs(st.surahs);
            } catch(e) { document.getElementById('surah-list').innerHTML = `<p class="text-red-500 text-[12px] text-center">ডেটা লোড ব্যর্থ।</p>`; }
        }

        function genParas() {
            for(let i=1; i<=30; i++) st.paras.push({ id: i, name: `পারা ${tbn(i)}` });
            renderParas(st.paras);
        }

        // --- Compact Rendering ---
        function renderSurahs(surahs) {
            let h = '';
            surahs.forEach((s) => {
                h += `
                <div onclick="openRdr(${s.id}, 'surah')" class="bg-white rounded-lg border border-gray-100 p-2.5 flex items-center justify-between cursor-pointer active:bg-teal-50 transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 islamic-star flex items-center justify-center font-bold text-teal text-[11px] shrink-0">${tbn(s.id)}</div>
                        <div class="flex flex-col">
                            <span class="font-medium text-[14px] leading-tight text-gray-800">${s.name_complex || s.name_arabic}</span>
                            <span class="text-[10px] text-gray-400 mt-0.5">${s.translated_name.name} • ${tbn(s.verses_count)} আয়াত</span>
                        </div>
                    </div>
                    <div class="text-teal text-[18px] arabic-text font-bold pr-1">${s.name_arabic}</div>
                </div>`;
            });
            document.getElementById('surah-list').innerHTML = h;
        }

        function renderParas(paras) {
            let h = '';
            paras.forEach((p) => {
                h += `
                <div onclick="openRdr(${p.id}, 'para')" class="bg-white rounded-lg border border-gray-100 p-2.5 flex items-center gap-3 cursor-pointer active:bg-teal-50 transition-colors">
                    <div class="w-8 h-8 islamic-star flex items-center justify-center font-bold text-teal text-[11px] shrink-0">${tbn(p.id)}</div>
                    <span class="font-medium text-[14px] text-gray-800">${p.name}</span>
                </div>`;
            });
            document.getElementById('para-list').innerHTML = h;
        }

        function saveHist(id, type) {
            let hist = JSON.parse(localStorage.getItem('qh3') || '[]');
            hist = hist.filter(h => h.id !== id || h.type !== type);
            hist.unshift({id, type});
            if(hist.length > 10) hist.pop();
            localStorage.setItem('qh3', JSON.stringify(hist));
        }

        function loadHist() {
            let hist = JSON.parse(localStorage.getItem('qh3') || '[]');
            const list = document.getElementById('history-list');
            const empty = document.getElementById('empty-history');
            
            if(!hist.length) { list.innerHTML = ''; empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');
            
            let h = '';
            hist.forEach((x) => {
                const item = x.type === 'surah' ? st.surahs.find(s => s.id === x.id) : st.paras.find(p => p.id === x.id);
                if(!item) return;
                h += `
                <div onclick="openRdr(${item.id}, '${x.type}')" class="bg-white rounded-lg border border-gray-100 p-2.5 flex items-center gap-3 cursor-pointer active:bg-teal-50">
                    <div class="w-8 h-8 islamic-star flex items-center justify-center font-bold text-teal text-[11px] shrink-0">${tbn(item.id)}</div>
                    <div class="flex flex-col">
                        <span class="font-medium text-[14px]">${x.type === 'surah' ? (item.name_complex || item.name_arabic) : item.name}</span>
                        <span class="text-[10px] text-gray-400">${x.type === 'surah' ? item.translated_name.name : 'পারা'}</span>
                    </div>
                </div>`;
            });
            list.innerHTML = h;
        }

        // --- Queue Engine ---
        async function fetchChap(id, type) {
            const meta = type === 'surah' ? st.surahs.find(s=>s.id===id) : st.paras.find(p=>p.id===id);
            if(!meta) return [];
            let vs = [], p = 1, tP = 1;
            const ep = type === 'surah' ? `verses/by_chapter/${id}` : `verses/by_juz/${id}`;
            while (p <= tP) {
                const res = await fetch(`${API}/${ep}?language=bn&words=false&translations=161&fields=text_uthmani&audio=7&per_page=100&page=${p}`);
                if(!res.ok) break;
                const d = await res.json();
                vs = vs.concat(d.verses);
                tP = d.pagination.total_pages; p++;
            }
            return vs.map(v => ({
                id: v.id, aNum: v.verse_number, tAr: v.text_uthmani, tBn: v.translations[0].text,
                url: v.audio?.url ? (v.audio.url.startsWith('//') ? 'https:'+v.audio.url : (v.audio.url.startsWith('http') ? v.audio.url : 'https://verses.quran.com/'+v.audio.url)) : null,
                sName: type === 'surah' ? (meta.name_complex || meta.name_arabic) : meta.name, 
                sId: id, type: type
            })).filter(v => v.url);
        }

        async function openRdr(id, type) {
            saveHist(id, type);
            setHeaderTexts(id, type);
            const con = document.getElementById('verses-container');
            const ldr = document.getElementById('reader-loading');
            con.innerHTML = ''; ldr.classList.remove('hidden'); ldr.style.display = 'flex';
            
            try {
                st.queue = await fetchChap(id, type);
                st.pIdx = -1; 
                ldr.classList.add('hidden'); ldr.style.display = 'none';
                renderVerses(st.queue);
                fetchNextChapBg();
            } catch (e) {
                ldr.style.display = 'none';
                con.innerHTML = `<div class="text-red-500 text-[12px] text-center p-2">লোড ব্যর্থ।</div>`;
            }
        }

        function setHeaderTexts(id, type) {
            const meta = type === 'surah' ? st.surahs.find(s=>s.id===id) : st.paras.find(p=>p.id===id);
            st.uId = id; st.uType = type;
            document.getElementById('main-container').classList.add('hidden');
            document.getElementById('reader-container').classList.remove('hidden');
            document.getElementById('btn-back').classList.remove('hidden');
            
            document.getElementById('header-title').textContent = type === 'surah' ? (meta.name_complex || meta.name_arabic) : meta.name;
            document.getElementById('reader-title').textContent = type === 'surah' ? (meta.name_complex || meta.name_arabic) : meta.name;
            document.getElementById('reader-subtitle').textContent = type === 'surah' ? meta.translated_name.name : 'আল কুরআন';
            document.getElementById('reader-revelation').textContent = type === 'surah' ? (meta.revelation_place === 'makkah' ? 'মাক্কী' : 'মাদানী') : '';
            document.getElementById('reader-count').textContent = type === 'surah' ? `${tbn(meta.verses_count)} আয়াত` : '';
            document.getElementById('reader-revelation').style.display = type === 'para' ? 'none' : 'block';
            document.getElementById('reader-count').style.display = type === 'para' ? 'none' : 'block';
        }

        function renderReaderUI(id, type) {
            setHeaderTexts(id, type);
            renderVerses(st.queue.filter(v => v.sId === id && v.type === type));
            updatePlayerUI(st.queue[st.pIdx], false);
        }

        function renderVerses(list) {
            let h = '';
            if(list.length > 0 && list[0].type === 'surah' && list[0].sId !== 1 && list[0].sId !== 9) {
                h += `<div class="text-center mb-2 mt-1"><img src="https://assets.quran.com/images/bismillah.svg" class="h-7 mx-auto opacity-70" style="filter: invert(41%) sepia(86%) saturate(417%) hue-rotate(124deg) brightness(88%) contrast(85%);"></div>`;
            }

            list.forEach((v) => {
                const gIdx = st.queue.indexOf(v);
                h += `
                <div id="vc-${gIdx}" onclick="playQ(${gIdx})" class="v-card bg-white rounded-lg border border-gray-100 p-3 cursor-pointer transition-all duration-200">
                    <div class="flex justify-between items-start gap-3">
                        <div class="w-6 h-6 rounded-full border border-teal-100 flex items-center justify-center text-[10px] font-bold text-teal bg-teal-50/50 shrink-0 mt-1">${tbn(v.aNum)}</div>
                        <div class="text-right flex-1">
                            <p class="arabic-text text-[20px] font-bold text-gray-900">${v.tAr}</p>
                        </div>
                    </div>
                    <div class="pt-2 flex justify-between items-end border-t border-gray-50 mt-2">
                        <p class="text-gray-600 text-[13px] leading-snug flex-1 pr-2">${v.tBn.replace(/<sup.*?<\/sup>/g, '')}</p>
                        <div class="play-btn w-6 h-6 rounded-full bg-teal-50 text-teal flex items-center justify-center">
                            <svg class="w-3 h-3 ml-0.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById('verses-container').innerHTML = h;
            if(st.pIdx >= 0 && st.queue[st.pIdx].sId === st.uId) updatePlayerUI(st.queue[st.pIdx], false);
        }

        // --- Audio Logic ---
        function setupAudio() {
            dom.a1.addEventListener('ended', onEnd); dom.a2.addEventListener('ended', onEnd);
            dom.a1.addEventListener('error', () => { if(st.isP) onEnd(); });
            dom.a2.addEventListener('error', () => { if(st.isP) onEnd(); });
            
            const updateState = (val) => {
                st.isP = val;
                if(val) {
                    dom.iPlay.classList.add('hidden'); dom.iPause.classList.remove('hidden');
                } else {
                    dom.iPlay.classList.remove('hidden'); dom.iPause.classList.add('hidden');
                }
            };

            dom.a1.addEventListener('play', () => updateState(true));
            dom.a2.addEventListener('play', () => updateState(true));
            dom.a1.addEventListener('pause', () => updateState(false));
            dom.a2.addEventListener('pause', () => updateState(false));

            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', togglePlayPause);
                navigator.mediaSession.setActionHandler('pause', togglePlayPause);
                navigator.mediaSession.setActionHandler('previoustrack', () => playQ(st.pIdx - 1));
                navigator.mediaSession.setActionHandler('nexttrack', () => onEnd());
            }
        }

        function playQ(i) {
            if (i < 0 || i >= st.queue.length) return;
            st.pIdx = i; const t = st.queue[i];
            st.aTag = 1; dom.a1.src = t.url;
            dom.a1.play().catch(e => console.log(e));
            updatePlayerUI(t, true);
            preloadQ(); fetchNextChapBg();
        }

        function onEnd() {
            const nI = st.pIdx + 1;
            if (nI >= st.queue.length) {
                st.isP = false;
                dom.iPlay.classList.remove('hidden'); dom.iPause.classList.add('hidden');
                return; 
            }
            st.pIdx = nI; const t = st.queue[nI];
            st.aTag = st.aTag === 1 ? 2 : 1;
            const aEl = st.aTag === 1 ? dom.a1 : dom.a2;
            
            if(!aEl.src.endsWith(t.url.split('/').pop())) aEl.src = t.url;
            aEl.play().catch(e => console.log(e));

            if(t.sId !== st.uId && document.visibilityState === 'visible') renderReaderUI(t.sId, t.type);
            updatePlayerUI(t, true);
            preloadQ(); fetchNextChapBg();
        }

        function preloadQ() {
            if (st.pIdx + 1 < st.queue.length) {
                const idle = st.aTag === 1 ? dom.a2 : dom.a1;
                idle.src = st.queue[st.pIdx + 1].url; idle.load();
            }
        }

        async function fetchNextChapBg() {
            if (st.isF || (st.queue.length - st.pIdx > 15)) return;
            st.isF = true;
            const lt = st.queue[st.queue.length - 1];
            const nId = lt.sId + 1;
            const lim = lt.type === 'surah' ? 114 : 30;
            if (nId <= lim) {
                try {
                    const nV = await fetchChap(nId, lt.type);
                    st.queue = st.queue.concat(nV);
                } catch(e) {}
            }
            st.isF = false;
        }

        function updatePlayerUI(t, scrl) {
            dom.p.classList.remove('translate-y-[150%]');
            document.getElementById('player-title').textContent = t.sName;
            document.getElementById('player-subtitle').textContent = `আয়াত ${tbn(t.aNum)}`;

            if (document.visibilityState === 'visible') {
                document.querySelectorAll('.v-card').forEach(el => {
                    el.classList.remove('active-card');
                    const b = el.querySelector('.play-btn');
                    if(b) b.style.opacity = '1';
                });
                const c = document.getElementById(`vc-${st.pIdx}`);
                if (c) {
                    c.classList.add('active-card');
                    const b = c.querySelector('.play-btn');
                    if(b) b.style.opacity = '0.3';
                    if(scrl) window.scrollTo({ top: c.offsetTop - 120, behavior: "smooth" });
                }
            }
            if('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({title: `আয়াত ${tbn(t.aNum)}`, artist: t.sName});
            }
        }

        function togglePlayPause() {
            if (st.pIdx === -1 && st.queue.length > 0) return playQ(0);
            (st.aTag === 1 ? dom.a1 : dom.a2)[st.isP ? 'pause' : 'play']();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
